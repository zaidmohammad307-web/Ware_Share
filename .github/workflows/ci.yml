name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: api/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      - name: Dependency audit (fails on critical)
        # yarn's exit code is a bitmask of severities found; 16 = critical
        run: yarn audit --level critical || [ $(( $? & 16 )) -eq 0 ]

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: client/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      - run: yarn build
      - name: Dependency audit (fails on critical)
        # yarn's exit code is a bitmask of severities found; 16 = critical
        run: yarn audit --level critical || [ $(( $? & 16 )) -eq 0 ]
